name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      alert_test:
        description: Send one test failure alert to the owner's phone
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
# Concurrency is per job: a newer push cancels an older test run, but a running deploy is never interrupted.
jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Firestore rules and two-device round trip (emulator, demo project)
        run: npm run test:emu
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:unit && npm run sim && npx playwright test --reporter=line --fail-on-flaky-tests
      - name: Keep the Linux screenshot baselines this run wrote (commit them to e2e/screens.spec.js-snapshots/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines-linux
          path: e2e/screens.spec.js-snapshots/*-linux.png
          if-no-files-found: ignore
      - name: Phone alert on failure
        if: failure()
        env:
          T: ${{ secrets.WTE_CI_TOKEN }}
        run: '[ -n "$T" ] && curl -s -m 20 -X POST -H "x-ci-token: $T" https://wte-push.vercel.app/api/send || true'
  alert-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.alert_test }}
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.WTE_CI_TOKEN }}
        run: 'curl -s -m 20 -X POST -H "x-ci-token: $T" https://wte-push.vercel.app/api/send'
  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          for f in index.html credits.html css js img design manifest.webmanifest sw.js; do
            if [ -e "$f" ]; then cp -r "$f" _site/; fi
          done
      - name: Stamp the service worker version
        run: sed -i "s/__VERSION__/${GITHUB_SHA::8}/" _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
  live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_URL: https://eitanpinczowski.github.io/what_to_eat/
      LIVE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.live.config.js --reporter=line
      - name: Phone alert on failure
        if: failure()
        env:
          T: ${{ secrets.WTE_CI_TOKEN }}
        run: '[ -n "$T" ] && curl -s -m 20 -X POST -H "x-ci-token: $T" https://wte-push.vercel.app/api/send || true'
