name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Concurrency is per job: a newer push cancels an older test run, but a running deploy is never interrupted.
jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:unit && npm run sim && npx playwright test --reporter=line --fail-on-flaky-tests
      # alert step added in Phase 0 item 3
  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          for f in index.html css js img design manifest.webmanifest sw.js; do
            if [ -e "$f" ]; then cp -r "$f" _site/; fi
          done
      - name: Stamp the service worker version
        run: sed -i "s/__VERSION__/${GITHUB_SHA::8}/" _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
  live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_URL: https://eitanpinczowski.github.io/what_to_eat/
      LIVE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.live.config.js --reporter=line
      # alert step added in Phase 0 item 3
